server {
    listen 80;
    listen [::]:80;
    server_name dropeacrm.cyou;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
    }
    location / {
        return 301 https://dropeacrm.cyou$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dropeacrm.cyou;
    ssl_certificate /etc/letsencrypt/live/dropeacrm.cyou/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dropeacrm.cyou/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:DropeaTLS:1m;
    ssl_session_timeout 1d;
    server_tokens off;
    client_max_body_size 2m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /api/webhooks/dropea {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:3381;
        proxy_set_header Host 127.0.0.1:3381;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /api/whatsapp/events {
        proxy_pass http://127.0.0.1:3381;
        proxy_set_header Host 127.0.0.1:3381;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3381;
        proxy_set_header Host 127.0.0.1:3381;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 900s;
    }
}
